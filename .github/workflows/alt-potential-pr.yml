name: Metric ALT potential evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        landmarks: [4, 8, 16]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Materialize candidate
        run: |
          python3 scripts/metric_alt_experiment.py --landmarks ${{ matrix.landmarks }}
          gofmt -w cmd/aegis/main.go internal/search/acbs.go internal/search/metric_alt_experiment.go internal/search/metric_alt_experiment_test.go
          go test ./internal/search
          go vet ./internal/search ./cmd/aegis
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Download extracts
        run: |
          set -euo pipefail
          download() {
            local name=$1
            local url=$2
            local dst="$RUNNER_TEMP/$name.osm.pbf"
            curl -fL --retry 6 --retry-all-errors --retry-delay 2 "$url" -o "$dst"
            osmium fileinfo "$dst" >/dev/null
            osmium cat "$dst" -o "$RUNNER_TEMP/$name.osm" --overwrite
          }
          download andorra https://download.geofabrik.de/europe/andorra-latest.osm.pbf
          download luxembourg https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
          download bremen https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf
      - name: Benchmark candidate
        run: |
          set -euo pipefail
          out="artifacts/metric-alt-k${{ matrix.landmarks }}"
          mkdir -p "$out/materialized"
          cp cmd/aegis/main.go "$out/materialized/"
          cp internal/search/acbs.go "$out/materialized/"
          cp internal/search/metric_alt_experiment.go "$out/materialized/"
          cp internal/search/metric_alt_experiment_test.go "$out/materialized/"
          for region in andorra luxembourg bremen; do
            for metric in distance time; do
              graph="$RUNNER_TEMP/$region-$metric.aegis"
              "$RUNNER_TEMP/aegis" import-osm \
                --input "$RUNNER_TEMP/$region.osm" \
                --output "$graph" \
                --profile car \
                --metric "$metric"
              for seed in 1010 424242 20260717; do
                run_dir="$out/$region-$metric/seed-$seed"
                mkdir -p "$run_dir"
                "$RUNNER_TEMP/aegis" benchmark \
                  --graph "$graph" \
                  --queries 300 \
                  --repeats 1 \
                  --order interleaved \
                  --suite mixed \
                  --seed "$seed" \
                  --algorithms aegis,aegis-entropic \
                  --output "$run_dir/report.json" \
                  2>&1 | tee "$run_dir/run.log"
              done
            done
          done
      - uses: actions/upload-artifact@v6
        with:
          name: metric-alt-k${{ matrix.landmarks }}
          path: artifacts/metric-alt-k${{ matrix.landmarks }}
          if-no-files-found: error
