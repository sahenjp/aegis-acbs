name: Bootstrap entropic scheduler candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/entropic-proof-rate-scheduler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Apply candidate
        shell: bash
        run: |
          base64 -d .github/bootstrap/apply-entropic.py.gz.b64 | gzip -d > /tmp/apply-entropic.py
          python3 /tmp/apply-entropic.py .
          gofmt -w \
            cmd/aegis/main.go \
            internal/search/acbs.go \
            internal/search/search.go \
            internal/search/search_test.go \
            internal/search/acbs_entropic_scheduler.go \
            internal/search/acbs_entropic_scheduler_test.go
      - name: Validate
        shell: bash
        run: |
          git diff --check
          bash -n scripts/benchmark-entropic.sh
          go test ./...
          go vet ./...
          go test -race ./internal/search ./internal/graph ./internal/bench ./internal/server
          go build ./cmd/aegis
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-entropic-scheduler.yml
          git rm .github/bootstrap/apply-entropic.py.gz.b64
          git add cmd/aegis/main.go internal/search docs README.md scripts/benchmark-entropic.sh
          git commit -m 'feat(search): add entropic proof-rate scheduler candidate'
          git push origin HEAD:feat/entropic-proof-rate-scheduler
