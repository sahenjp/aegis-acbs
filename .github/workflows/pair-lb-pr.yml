name: Pair lower-bound scan evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Materialize candidate
        run: |
          python3 scripts/pair_lb_experiment.py
          gofmt -w internal/search/acbs.go internal/search/search.go internal/search/acbs_pair_bound_test.go
          go test ./internal/search
          go vet ./internal/search
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Download Andorra extract
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            https://download.geofabrik.de/europe/andorra-latest.osm.pbf \
            -o "$RUNNER_TEMP/andorra.osm.pbf"
          osmium fileinfo "$RUNNER_TEMP/andorra.osm.pbf" >/dev/null
          osmium cat "$RUNNER_TEMP/andorra.osm.pbf" \
            -o "$RUNNER_TEMP/andorra.osm" --overwrite
      - name: Probe pair bound
        run: |
          set -euo pipefail
          out=artifacts/pair-lb
          mkdir -p "$out/materialized"
          cp internal/search/acbs.go "$out/materialized/"
          cp internal/search/search.go "$out/materialized/"
          cp internal/search/acbs_pair_bound_test.go "$out/materialized/"
          for metric in distance time; do
            graph="$RUNNER_TEMP/andorra-$metric.aegis"
            "$RUNNER_TEMP/aegis" import-osm \
              --input "$RUNNER_TEMP/andorra.osm" \
              --output "$graph" \
              --profile car \
              --metric "$metric"
            run_dir="$out/andorra-$metric/seed-1010"
            mkdir -p "$run_dir"
            "$RUNNER_TEMP/aegis" benchmark \
              --graph "$graph" \
              --queries 50 \
              --repeats 1 \
              --order interleaved \
              --suite mixed \
              --seed 1010 \
              --algorithms aegis,aegis-entropic \
              --output "$run_dir/report.json"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: pair-lower-bound-reports
          path: artifacts/pair-lb
          if-no-files-found: error
