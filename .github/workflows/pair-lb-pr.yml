name: Pair lower-bound scan evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Materialize candidate
        run: |
          python3 scripts/pair_lb_experiment.py
          gofmt -w internal/search/acbs.go internal/search/search.go internal/search/acbs_pair_bound_test.go
          go test ./internal/search
          go vet ./internal/search
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Download extracts
        run: |
          set -euo pipefail
          download() {
            local name=$1
            local url=$2
            local dst="$RUNNER_TEMP/$name.osm.pbf"
            curl -fL --retry 6 --retry-all-errors --retry-delay 2 "$url" -o "$dst"
            osmium fileinfo "$dst" >/dev/null
            osmium cat "$dst" -o "$RUNNER_TEMP/$name.osm" --overwrite
          }
          download andorra https://download.geofabrik.de/europe/andorra-latest.osm.pbf
          download luxembourg https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
          download bremen https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf
      - name: Benchmark deterministic work
        run: |
          set -euo pipefail
          out=artifacts/pair-lb
          mkdir -p "$out/materialized"
          cp internal/search/acbs.go "$out/materialized/"
          cp internal/search/search.go "$out/materialized/"
          cp internal/search/acbs_pair_bound_test.go "$out/materialized/"
          for region in andorra luxembourg bremen; do
            for metric in distance time; do
              graph="$RUNNER_TEMP/$region-$metric.aegis"
              "$RUNNER_TEMP/aegis" import-osm \
                --input "$RUNNER_TEMP/$region.osm" \
                --output "$graph" \
                --profile car \
                --metric "$metric"
              run_dir="$out/$region-$metric/seed-1010"
              mkdir -p "$run_dir"
              "$RUNNER_TEMP/aegis" benchmark \
                --graph "$graph" \
                --queries 100 \
                --repeats 1 \
                --order interleaved \
                --suite mixed \
                --seed 1010 \
                --algorithms aegis,aegis-entropic \
                --output "$run_dir/report.json"
            done
          done
      - uses: actions/upload-artifact@v6
        with:
          name: pair-lower-bound-reports
          path: artifacts/pair-lb
          if-no-files-found: error
