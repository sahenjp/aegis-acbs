name: RoutingKit HCBS epoch-queue evaluation

on:
  pull_request:
    paths:
      - 'scripts/routingkit_hcbs_query.cpp'
      - 'scripts/export_routingkit_hcbs_scale.go'
      - 'scripts/materialize_hcbs_epoch_queue.py'
      - '.github/workflows/routingkit-hcbs-scale.yml'

concurrency:
  group: routingkit-hcbs-epoch-queue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regional:
    strategy:
      fail-fast: false
      matrix:
        region: [andorra, bremen, luxembourg, tokyo]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install and build pinned RoutingKit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_hcbs_epoch_queue.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev g++ osmium-tool
          git clone https://github.com/RoutingKit/RoutingKit.git "$RUNNER_TEMP/RoutingKit"
          git -C "$RUNNER_TEMP/RoutingKit" checkout 54d49bb0cdea56dde182357522e4e86a03c57852
          make -C "$RUNNER_TEMP/RoutingKit" -j2
          g++ -O3 -DNDEBUG -std=c++17 -march=native \
            -I"$RUNNER_TEMP/RoutingKit/include" \
            scripts/routingkit_hcbs_query.cpp \
            -L"$RUNNER_TEMP/RoutingKit/lib" -lroutingkit \
            -lz -fopenmp -pthread -lm \
            -o "$RUNNER_TEMP/routingkit_hcbs_query"
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
          go run -tags routingkithcbs scripts/export_routingkit_hcbs_scale.go -h >/dev/null
      - name: Download road graph
        shell: bash
        run: |
          set -euo pipefail
          region='${{ matrix.region }}'
          case "$region" in
            andorra)
              curl -fL --retry 6 --retry-all-errors --retry-delay 2 https://download.geofabrik.de/europe/andorra-latest.osm.pbf -o "$RUNNER_TEMP/input.osm.pbf"
              ;;
            bremen)
              curl -fL --retry 6 --retry-all-errors --retry-delay 2 https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf -o "$RUNNER_TEMP/input.osm.pbf"
              ;;
            luxembourg)
              curl -fL --retry 6 --retry-all-errors --retry-delay 2 https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf -o "$RUNNER_TEMP/input.osm.pbf"
              ;;
            tokyo)
              curl -fL --retry 6 --retry-all-errors --retry-delay 2 https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf -o "$RUNNER_TEMP/kanto.osm.pbf"
              osmium extract --bbox 139.45,35.45,140.05,35.90 --strategy complete_ways --overwrite --output "$RUNNER_TEMP/input.osm.pbf" "$RUNNER_TEMP/kanto.osm.pbf"
              ;;
          esac
          osmium fileinfo "$RUNNER_TEMP/input.osm.pbf" >/dev/null
          osmium cat "$RUNNER_TEMP/input.osm.pbf" -o "$RUNNER_TEMP/input.osm" --overwrite
      - name: Import identical Aegis graph
        shell: bash
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/import.time" "$RUNNER_TEMP/aegis" import-osm --input "$RUNNER_TEMP/input.osm" --output "$RUNNER_TEMP/road-time.aegis" --profile car --metric time
      - name: Export 30k mixed queries
        shell: bash
        run: |
          go run -tags routingkithcbs scripts/export_routingkit_hcbs_scale.go --graph "$RUNNER_TEMP/road-time.aegis" --queries-per-seed 10000 --seeds 1010,424242,20260717 --output "$RUNNER_TEMP/hcbs-input.txt"
      - name: Compare RoutingKit and epoch-clear queues
        shell: bash
        run: |
          set -euo pipefail
          dir="artifacts/hcbs-epoch-queue-${{ matrix.region }}"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/import.time" "$dir/"
          uname -a > "$dir/hardware.txt"
          lscpu >> "$dir/hardware.txt"
          /usr/bin/time -v -o "$dir/resources.time" env LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib" "$RUNNER_TEMP/routingkit_hcbs_query" "$RUNNER_TEMP/hcbs-input.txt" 31 | tee "$dir/result.txt"
          grep -q 'routingkit-alternate .*correct=true' "$dir/result.txt"
          grep -q 'hcbs-lower-key .*correct=true' "$dir/result.txt"
          grep -q 'hcbs-epoch-queue-lower-key .*correct=true' "$dir/result.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: routingkit-hcbs-epoch-queue-${{ matrix.region }}
          path: artifacts/hcbs-epoch-queue-${{ matrix.region }}
          if-no-files-found: error
