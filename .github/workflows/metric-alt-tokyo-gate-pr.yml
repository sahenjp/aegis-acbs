name: Metric ALT Tokyo promotion gate

on:
  pull_request:
    paths:
      - 'internal/search/**'
      - 'internal/bench/**'
      - 'cmd/aegis/**'
      - 'scripts/**'
      - '.github/workflows/metric-alt-tokyo-gate-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: tokyo-r${{ matrix.repeat }}-${{ matrix.metric }}-s${{ matrix.base_seed }}-p${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repeat: [1, 2]
        metric: [distance, time]
        base_seed: [1010, 424242, 20260717]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Define run metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          seed=$(( ${{ matrix.base_seed }} + ${{ matrix.shard }} * 1000003 ))
          root="artifacts/metric-alt-tokyo/repeat-${{ matrix.repeat }}/${{ matrix.metric }}/base-${{ matrix.base_seed }}/shard-${{ matrix.shard }}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          mkdir -p "$root"
          {
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "repeat=${{ matrix.repeat }}"
            echo "metric=${{ matrix.metric }}"
            echo "base_seed=${{ matrix.base_seed }}"
            echo "shard=${{ matrix.shard }}"
            echo "effective_seed=$seed"
            echo "queries=1000"
            uname -a
            lscpu
            free -h
            go version
          } > "$root/hardware.txt"
      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Download Kanto extract
        run: |
          set -euo pipefail
          pbf="$RUNNER_TEMP/kanto.osm.pbf"
          curl -fL --retry 6 --retry-all-errors --retry-delay 3 \
            https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf \
            -o "$pbf"
          osmium fileinfo "$pbf" > "${{ steps.meta.outputs.root }}/source-pbf.txt"
          osmium cat "$pbf" -o "$RUNNER_TEMP/kanto.osm" --overwrite
      - name: Import Tokyo-scale graph
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/kanto-${{ matrix.metric }}.aegis"
          /usr/bin/time -v "$RUNNER_TEMP/aegis" import-osm \
            --input "$RUNNER_TEMP/kanto.osm" \
            --output "$graph" \
            --profile car \
            --metric "${{ matrix.metric }}" \
            2> "${{ steps.meta.outputs.root }}/import.log"
          "$RUNNER_TEMP/aegis" inspect --graph "$graph" \
            > "${{ steps.meta.outputs.root }}/graph.json"
      - name: Benchmark shard
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/kanto-${{ matrix.metric }}.aegis"
          /usr/bin/time -v "$RUNNER_TEMP/aegis" benchmark \
            --graph "$graph" \
            --queries 1000 \
            --repeats 1 \
            --order interleaved \
            --suite mixed \
            --seed "${{ steps.meta.outputs.seed }}" \
            --algorithms dijkstra,bidijkstra,astar,aegis,aegis-alt \
            --measure-memory \
            --output "${{ steps.meta.outputs.root }}/report.json" \
            --html "" \
            2> >(tee "${{ steps.meta.outputs.root }}/preprocess-and-resource.log" >&2)
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: metric-alt-tokyo-r${{ matrix.repeat }}-${{ matrix.metric }}-s${{ matrix.base_seed }}-p${{ matrix.shard }}
          path: ${{ steps.meta.outputs.root }}
          if-no-files-found: error
          retention-days: 30
