name: Complexity Lab

on:
  push:
    branches: [research/complexity-lab]
  pull_request:
    paths:
      - 'cmd/aegis-lab/**'
      - 'internal/complexity/**'
      - 'docs/COMPLEXITY_LAB.md'
      - '.github/workflows/complexity-lab.yml'

permissions:
  contents: read

concurrency:
  group: complexity-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', '1.26.x']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./internal/complexity/...
      - run: go vet ./internal/complexity/... ./cmd/aegis-lab
      - run: go build ./cmd/aegis-lab

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./internal/complexity/...
