name: Metric ALT candidate validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/metric-alt-potential
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Materialize sources
        run: |
          if [[ ! -f internal/search/metric_alt.go ]]; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/materialize_metric_alt.py")
          text = path.read_text()
          old = "func resolve(g *graph.Graph, value string) (int, error) {"
          new = "func resolve(g *graph.Graph, s string) (int, error) {"
          if text.count(old) != 2:
              raise SystemExit(f"expected two resolve signature literals, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
            python3 scripts/materialize_metric_alt.py
            python3 - <<'PY'
          from pathlib import Path
          path = Path("internal/search/metric_alt_test.go")
          text = path.read_text()
          old = "\tg := gridGraph(t, 40, 40, true)\n\tpreparation, err := PrepareMetricALT(g, 4)"
          new = "\tg := gridGraph(t, 40, 40, true)\n\t// Force the indexed execution tier without inflating this exhaustive fixture.\n\tg.EdgeCount = metricALTMinimumEdges\n\tpreparation, err := PrepareMetricALT(g, 4)"
          if text.count(old) != 1:
              raise SystemExit(f"expected one indexed fixture, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          fi
          gofmt -w cmd/aegis/main.go internal/search/acbs.go internal/search/search.go internal/search/metric_alt.go internal/search/metric_alt_test.go
      - name: Validate
        run: |
          git diff --check
          go test ./...
          go vet ./...
          go test -race ./internal/search ./internal/graph ./internal/bench ./internal/server
          go build ./cmd/aegis
      - name: Fixture smoke
        run: |
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
          "$RUNNER_TEMP/aegis" import-osm \
            --input benchdata/hatfield-uk.osm \
            --output "$RUNNER_TEMP/hatfield.aegis" \
            --profile car \
            --metric time
          "$RUNNER_TEMP/aegis" benchmark \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --queries 100 \
            --repeats 1 \
            --algorithms aegis,aegis-alt \
            --output "$RUNNER_TEMP/report.json" \
            --html ""
      - name: Commit validated sources
        run: |
          git add cmd/aegis/main.go \
            internal/search/acbs.go \
            internal/search/search.go \
            internal/search/metric_alt.go \
            internal/search/metric_alt_test.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(search): add metric ALT potential candidate"
          git push origin HEAD:feat/metric-alt-potential
