name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Validate release tag provenance
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Refusing release: tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)."
            exit 1
          fi
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::Refusing release: tag must point at current main ($main_sha), got $GITHUB_SHA."
            exit 1
          fi
      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate evidence
        if: steps.existing.outputs.exists != 'true'
        run: python3 scripts/check-release-evidence.py research/tokyo-time-2026-07-18
      - name: Build release assets
        if: steps.existing.outputs.exists != 'true'
        run: scripts/build-release.sh
      - name: Require release tag to remain current main
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "::error::Refusing release: tag is no longer current main ($main_sha), got $GITHUB_SHA."
            exit 1
          fi
      - name: Create release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Aegis ACBS $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
