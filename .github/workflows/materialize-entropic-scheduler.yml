name: Materialize entropic scheduler candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'feat/entropic-proof-rate-scheduler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - id: state
        name: Detect existing source
        shell: bash
        run: |
          if [[ -f internal/search/acbs_entropic_scheduler.go ]]; then
            echo 'materialized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'materialized=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.state.outputs.materialized == 'false'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - if: steps.state.outputs.materialized == 'false'
        name: Apply validated candidate
        shell: bash
        run: |
          cat .github/bootstrap/payload/* > /tmp/apply-entropic.py.gz.b64
          echo '1463f2fe95109c538efbfaddf5f3e91407d33ab58f5abc91dd5c705735353bdc  /tmp/apply-entropic.py.gz.b64' | sha256sum -c -
          base64 -d /tmp/apply-entropic.py.gz.b64 | gzip -d > /tmp/apply-entropic.py
          python3 /tmp/apply-entropic.py .
          gofmt -w \
            cmd/aegis/main.go \
            internal/search/acbs.go \
            internal/search/search.go \
            internal/search/search_test.go \
            internal/search/acbs_entropic_scheduler.go \
            internal/search/acbs_entropic_scheduler_test.go
          chmod +x scripts/benchmark-entropic.sh
      - if: steps.state.outputs.materialized == 'false'
        name: Validate
        shell: bash
        run: |
          git diff --check
          bash -n scripts/benchmark-entropic.sh
          go test ./...
          go vet ./...
          go test -race ./internal/search ./internal/graph ./internal/bench ./internal/server
          go build ./cmd/aegis
      - if: steps.state.outputs.materialized == 'false'
        name: Commit source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            cmd/aegis/main.go \
            docs/ALGORITHM.md \
            docs/ENTROPIC_SCHEDULER.md \
            internal/search/acbs.go \
            internal/search/acbs_entropic_scheduler.go \
            internal/search/acbs_entropic_scheduler_test.go \
            internal/search/search.go \
            internal/search/search_test.go \
            scripts/benchmark-entropic.sh
          git diff --cached --check
          git commit -m 'feat(search): add entropic proof-rate scheduler candidate'
          git push origin HEAD:feat/entropic-proof-rate-scheduler
