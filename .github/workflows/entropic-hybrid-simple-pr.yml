name: Entropic hybrid scheduler evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  hybrid:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            args: ''
          - name: proximal
            args: '--minimum-share 0.0625 --temperature 0.50 --switch-penalty 0.75 --priority-after 0.50 --linear-budget'
          - name: decisive
            args: '--minimum-share 0.0625 --temperature 0.35 --switch-penalty 0.50 --priority-after 0.50 --linear-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Materialize hybrid
        shell: bash
        run: |
          python3 scripts/entropic_hybrid_experiment.py ${{ matrix.args }}
          gofmt -w internal/search/acbs.go internal/search/acbs_entropic_scheduler.go
          go test ./internal/search
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Download and convert extracts
        run: |
          curl -fsSL --retry 3 https://download.geofabrik.de/europe/andorra-latest.osm.pbf -o "$RUNNER_TEMP/andorra.osm.pbf"
          curl -fsSL --retry 3 https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf -o "$RUNNER_TEMP/liechtenstein.osm.pbf"
          osmium cat "$RUNNER_TEMP/andorra.osm.pbf" -o "$RUNNER_TEMP/andorra.osm" --overwrite
          osmium cat "$RUNNER_TEMP/liechtenstein.osm.pbf" -o "$RUNNER_TEMP/liechtenstein.osm" --overwrite
      - name: Import and evaluate deterministic work
        run: |
          set -euo pipefail
          mkdir -p "artifacts/hybrid-${{ matrix.name }}"
          for region in andorra liechtenstein; do
            for metric in distance time; do
              graph="$RUNNER_TEMP/$region-$metric.aegis"
              "$RUNNER_TEMP/aegis" import-osm \
                --input "$RUNNER_TEMP/$region.osm" \
                --output "$graph" \
                --profile car \
                --metric "$metric"
              "$RUNNER_TEMP/aegis" benchmark \
                --graph "$graph" \
                --queries 1000 \
                --repeats 1 \
                --order interleaved \
                --suite mixed \
                --seed 1010 \
                --algorithms aegis,aegis-entropic \
                --output "artifacts/hybrid-${{ matrix.name }}/$region-$metric.json"
            done
          done
      - name: Upload reports
        uses: actions/upload-artifact@v6
        with:
          name: entropic-hybrid-${{ matrix.name }}
          path: artifacts/hybrid-${{ matrix.name }}
          if-no-files-found: error
