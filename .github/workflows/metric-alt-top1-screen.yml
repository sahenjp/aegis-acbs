name: CH same-graph screening

on:
  pull_request:
    paths:
      - 'internal/search/**'
      - 'internal/bench/**'
      - 'scripts/materialize_metric_alt_layout_sweep.py'
      - 'scripts/materialize_metric_alt_top1.py'
      - 'scripts/ch_baseline.go'
      - '.github/workflows/metric-alt-top1-screen.yml'

concurrency:
  group: ch-same-graph-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Materialize exact Aegis landmark references
        run: |
          python3 scripts/materialize_metric_alt_top1.py
          gofmt -w internal/search/acbs.go internal/search/search.go internal/search/metric_alt.go internal/search/metric_alt_test.go
      - name: Validate Aegis and CH adapter
        run: |
          set -euo pipefail
          git diff --check
          go test ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
          cp go.mod "$RUNNER_TEMP/go.mod.before"
          if [ -f go.sum ]; then cp go.sum "$RUNNER_TEMP/go.sum.before"; fi
          go get github.com/LdDl/ch@v1.10.0
          go run -tags chbaseline scripts/ch_baseline.go -h
          mv "$RUNNER_TEMP/go.mod.before" go.mod
          if [ -f "$RUNNER_TEMP/go.sum.before" ]; then
            mv "$RUNNER_TEMP/go.sum.before" go.sum
          else
            rm -f go.sum
          fi
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Download real road graphs
        run: |
          set -euo pipefail
          download() {
            local name=$1
            local url=$2
            local pbf="$RUNNER_TEMP/$name.osm.pbf"
            curl -fL --retry 6 --retry-all-errors --retry-delay 3 "$url" -o "$pbf"
            osmium fileinfo "$pbf" >/dev/null
            osmium cat "$pbf" -o "$RUNNER_TEMP/$name.osm" --overwrite
          }
          download andorra https://download.geofabrik.de/europe/andorra-latest.osm.pbf
          download bremen https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf
          download luxembourg https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
          curl -fL --retry 6 --retry-all-errors --retry-delay 3 \
            https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf \
            -o "$RUNNER_TEMP/kanto.osm.pbf"
          osmium extract \
            --bbox 139.45,35.45,140.05,35.90 \
            --strategy complete_ways --overwrite \
            --output "$RUNNER_TEMP/tokyo-metro.osm.pbf" \
            "$RUNNER_TEMP/kanto.osm.pbf"
          osmium cat "$RUNNER_TEMP/tokyo-metro.osm.pbf" -o "$RUNNER_TEMP/tokyo-metro.osm" --overwrite
      - name: Import graphs
        run: |
          set -euo pipefail
          for region in andorra bremen luxembourg; do
            /usr/bin/time -v -o "import-$region.time" \
              "$RUNNER_TEMP/aegis" import-osm \
                --input "$RUNNER_TEMP/$region.osm" \
                --output "$RUNNER_TEMP/$region-time.aegis" \
                --profile car --metric time
          done
          /usr/bin/time -v -o import-tokyo.time \
            "$RUNNER_TEMP/aegis" import-osm \
              --input "$RUNNER_TEMP/tokyo-metro.osm" \
              --output "$RUNNER_TEMP/tokyo-time.aegis" \
              --profile car --metric time
      - name: Generate same-query exact reports
        run: |
          set -euo pipefail
          out=artifacts/ch-screen
          mkdir -p "$out"
          cp import-*.time "$out/"
          uname -a > "$out/hardware.txt"
          lscpu >> "$out/hardware.txt"
          free -h >> "$out/hardware.txt"
          go version >> "$out/hardware.txt"
          for region in andorra bremen luxembourg tokyo; do
            run_dir="$out/$region"
            mkdir -p "$run_dir"
            repeats=3
            order=rotated
            if [ "$region" = tokyo ]; then
              repeats=1
              order=interleaved
            fi
            "$RUNNER_TEMP/aegis" benchmark \
              --graph "$RUNNER_TEMP/$region-time.aegis" \
              --queries 1000 \
              --repeats "$repeats" \
              --order "$order" \
              --suite mixed \
              --seed 1010 \
              --algorithms dijkstra,bidijkstra,astar,aegis,aegis-alt-top1 \
              --output "$run_dir/aegis.json" \
              --html "" \
              2> >(tee "$run_dir/aegis-preprocess.log" >&2)
          done
      - name: Benchmark pinned Contraction Hierarchies comparator
        run: |
          set -euo pipefail
          cp go.mod "$RUNNER_TEMP/go.mod.before"
          if [ -f go.sum ]; then cp go.sum "$RUNNER_TEMP/go.sum.before"; fi
          go get github.com/LdDl/ch@v1.10.0
          for region in andorra bremen luxembourg tokyo; do
            run_dir="artifacts/ch-screen/$region"
            /usr/bin/time -v -o "$run_dir/ch-resources.time" \
              go run -tags chbaseline scripts/ch_baseline.go \
                --graph "$RUNNER_TEMP/$region-time.aegis" \
                --report "$run_dir/aegis.json" \
                --repeats 3 \
                --output "$run_dir/ch.json" \
                2> >(tee "$run_dir/ch.log" >&2)
          done
          mv "$RUNNER_TEMP/go.mod.before" go.mod
          if [ -f "$RUNNER_TEMP/go.sum.before" ]; then
            mv "$RUNNER_TEMP/go.sum.before" go.sum
          else
            rm -f go.sum
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ch-same-graph-screen
          path: artifacts/ch-screen
          if-no-files-found: error
