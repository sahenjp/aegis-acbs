name: Validate entropic scheduler candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'feat/entropic-proof-rate-scheduler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Apply candidate
        shell: bash
        run: |
          cat .github/bootstrap/payload/* > /tmp/apply-entropic.py.gz.b64
          echo '1463f2fe95109c538efbfaddf5f3e91407d33ab58f5abc91dd5c705735353bdc  /tmp/apply-entropic.py.gz.b64' | sha256sum -c -
          base64 -d /tmp/apply-entropic.py.gz.b64 | gzip -d > /tmp/apply-entropic.py
          python3 /tmp/apply-entropic.py .
          gofmt -w \
            cmd/aegis/main.go \
            internal/search/acbs.go \
            internal/search/search.go \
            internal/search/search_test.go \
            internal/search/acbs_entropic_scheduler.go \
            internal/search/acbs_entropic_scheduler_test.go
      - name: Validate
        shell: bash
        run: |
          git diff --check
          bash -n scripts/benchmark-entropic.sh
          go test ./...
          go vet ./...
          go test -race ./internal/search ./internal/graph ./internal/bench ./internal/server
          go build ./cmd/aegis
      - name: Package validated candidate
        shell: bash
        run: |
          mkdir -p /tmp/entropic-candidate
          git diff --binary -- . ':!.github' > /tmp/entropic-candidate/candidate.patch
          tar --exclude=.git --exclude=.github -czf /tmp/entropic-candidate/candidate-files.tar.gz \
            README.md cmd internal docs scripts
          sha256sum /tmp/entropic-candidate/* > /tmp/entropic-candidate/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: entropic-scheduler-candidate
          path: /tmp/entropic-candidate
          if-no-files-found: error
