name: HCBS gofmt fix

on:
  push:
    branches:
      - research/native-hcbs-sidecar
    paths:
      - '.github/workflows/hcbs-gofmt-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/native-hcbs-sidecar
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/search/hcbs_index.go internal/search/hcbs_index_test.go
          if git diff --quiet -- internal/search/hcbs_index.go internal/search/hcbs_index_test.go; then
            echo 'already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/search/hcbs_index.go internal/search/hcbs_index_test.go
          git commit -m 'chore: gofmt native HCBS sources'
          git push origin HEAD:research/native-hcbs-sidecar
