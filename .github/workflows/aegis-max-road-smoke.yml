name: Aegis Max Road Smoke

on:
  push:
    branches: [research/aegis-max-exact]
    paths:
      - 'scripts/aegis-max-road-bench.sh'
      - '.github/workflows/aegis-max-road-smoke.yml'
      - 'cmd/aegis-max-batch/**'
      - 'cmd/aegis-max-select/**'
      - 'cmd/aegis-routingkit-export/**'
      - 'cmd/aegis-routingkit-cch-export/**'
      - 'internal/maxsearch/**'
      - 'experimental/routingkit/**'
  pull_request:
    paths:
      - 'scripts/aegis-max-road-bench.sh'
      - '.github/workflows/aegis-max-road-smoke.yml'
      - 'cmd/aegis-max-batch/**'
      - 'cmd/aegis-max-select/**'
      - 'internal/maxsearch/**'

permissions:
  contents: read

concurrency:
  group: aegis-max-road-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  andorra:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ zlib1g-dev osmium-tool curl
      - name: Run reproducible Andorra exact benchmark
        shell: bash
        env:
          AEGIS_BENCH_MAKE_JOBS: '2'
        run: |
          set -euo pipefail
          bash scripts/aegis-max-road-bench.sh andorra 120 time 8 "$RUNNER_TEMP/road-smoke"
      - name: Exercise adaptive persistent batch selection
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/aegis-max-road-bin"
          OUT="$RUNNER_TEMP/road-smoke"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          common=(
            --graph "$OUT/andorra-time.aegis" --queries "$OUT/queries.txt"
            --routingkit-ch-server "$BIN/aegis-routingkit-ch-server" --routingkit-ch-graph "$OUT/graph.routingkit-ch"
            --routingkit-cch-server "$BIN/aegis-routingkit-cch-server" --routingkit-cch-graph "$OUT/graph.routingkit-cch"
            --alt-landmarks 8 --auto-select-benchmark "$OUT/summary.json"
            --verify --summary-only --timeout 20m
          )
          "$BIN/aegis-max-batch" "${common[@]}" --metric-updates 0 --selection-stat mean > "$OUT/auto-mean-static.json"
          "$BIN/aegis-max-batch" "${common[@]}" --metric-updates 4 --selection-stat mean > "$OUT/auto-mean-updates.json"
          "$BIN/aegis-max-batch" "${common[@]}" --metric-updates 0 --selection-stat p95 > "$OUT/auto-p95-static.json"
          "$BIN/aegis-max-batch" "${common[@]}" --metric-updates 0 --selection-stat p99 > "$OUT/auto-p99-static.json"
          cp "$OUT/auto-mean-static.json" "$OUT/auto-static.json"
          cp "$OUT/auto-mean-updates.json" "$OUT/auto-updates.json"
          python3 - \
            "$OUT/auto-mean-static.json" "$OUT/auto-mean-updates.json" \
            "$OUT/auto-p95-static.json" "$OUT/auto-p99-static.json" <<'PY'
          import json, sys
          expected_stats = ['mean', 'mean', 'p95', 'p99']
          for path, expected_stat in zip(sys.argv[1:], expected_stats):
              d = json.load(open(path, encoding='utf-8'))
              selected = d['selection']['selected']
              assert d['selection']['statistic'] == expected_stat
              assert d['report']['summary']['primary'] == selected
              assert d['report']['summary']['queries'] == 120
              assert d['report']['summary']['primaryWins'] == 120
              print(path, expected_stat, 'selected', selected)
          PY
      - name: Reject mismatched benchmark identity
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/aegis-max-road-bin"
          OUT="$RUNNER_TEMP/road-smoke"
          python3 - "$OUT/summary.json" "$OUT/bad-summary.json" <<'PY'
          import json, sys
          src, dst = sys.argv[1:]
          d = json.load(open(src, encoding='utf-8'))
          assert len(d['graphFingerprint']) == 64
          d['graphFingerprint'] = '0' * 64
          json.dump(d, open(dst, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          PY
          if "$BIN/aegis-max-batch" \
            --graph "$OUT/andorra-time.aegis" --queries "$OUT/queries.txt" \
            --auto-select-benchmark "$OUT/bad-summary.json" \
            --verify --summary-only --timeout 20m > "$OUT/bad-auto.json" 2> "$OUT/bad-auto.err"; then
            echo "mismatched benchmark fingerprint was unexpectedly accepted" >&2
            exit 1
          fi
          grep -q 'benchmark graph fingerprint mismatch' "$OUT/bad-auto.err"
      - name: Assert evidence and publish summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - \
            "$RUNNER_TEMP/road-smoke/summary.json" \
            "$RUNNER_TEMP/road-smoke/auto-mean-static.json" \
            "$RUNNER_TEMP/road-smoke/auto-mean-updates.json" \
            "$RUNNER_TEMP/road-smoke/auto-p95-static.json" \
            "$RUNNER_TEMP/road-smoke/auto-p99-static.json" \
            "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          src, mean_static_p, mean_updates_p, p95_p, p99_p, summary = sys.argv[1:]
          d = json.load(open(src, encoding='utf-8'))
          mean_static = json.load(open(mean_static_p, encoding='utf-8'))
          mean_updates = json.load(open(mean_updates_p, encoding='utf-8'))
          p95 = json.load(open(p95_p, encoding='utf-8'))
          p99 = json.load(open(p99_p, encoding='utf-8'))
          assert d['allCorrect'] is True
          assert d['queries'] == 120
          assert len(d['graphFingerprint']) == 64
          for stat, path in [('mean', mean_static), ('p95', p95), ('p99', p99)]:
              assert path['selection']['statistic'] == stat
          names = {r['algorithm'] for r in d['rankingByQueryMean']}
          required = {'dijkstra','bidijkstra','astar','aegis','routingkit-ch','routingkit-cch','alt'}
          assert required <= names, (required - names)
          with open(summary, 'a', encoding='utf-8') as out:
              out.write(f"## Aegis Max Andorra smoke\n\n{d['nodes']:,} nodes · {d['edges']:,} edges · {d['queries']} identical queries · all correct: **true**\n\n")
              out.write(
                  'adaptive: '
                  f"mean/static **{mean_static['selection']['selected']}** · "
                  f"mean/4 updates **{mean_updates['selection']['selected']}** · "
                  f"p95/static **{p95['selection']['selected']}** · "
                  f"p99/static **{p99['selection']['selected']}**\n\n"
              )
              out.write('| algorithm | mean | p50 | p95 | p99 | preprocess | update | amortized mean |\n|---|---:|---:|---:|---:|---:|---:|---:|\n')
              for r in d['rankingByQueryMean']:
                  ms = lambda n: f"{n/1e6:.6f} ms"
                  out.write(f"| {r['algorithm']} | {ms(r['meanNs'])} | {ms(r['p50Ns'])} | {ms(r['p95Ns'])} | {ms(r['p99Ns'])} | {ms(r['preprocessNs'])} | {ms(r['updateNs'])} | {ms(r['amortizedMeanNs'])} |\n")
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
