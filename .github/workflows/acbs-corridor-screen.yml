name: ACBS corridor screening

on:
  pull_request:
    paths:
      - 'scripts/materialize_acbs_corridor.py'
      - 'scripts/patch_corridor_test_fixture.py'
      - '.github/workflows/acbs-corridor-screen.yml'

concurrency:
  group: acbs-corridor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Materialize corridor candidate
        run: |
          python3 scripts/materialize_acbs_corridor.py
          python3 scripts/patch_corridor_test_fixture.py
          gofmt -w internal/search/acbs.go internal/search/search.go internal/search/corridor_generated.go internal/search/corridor_generated_test.go
      - name: Validate exactness and race safety
        run: |
          set -euo pipefail
          git diff --check
          go test ./...
          go vet ./...
          # The repository-wide race allocation ceiling is a separate known
          # runner-sensitive assertion. Race the new corridor tests directly,
          # while still racing the other concurrent packages normally.
          go test -race ./internal/search -run 'TestCorridor'
          go test -race ./internal/graph ./internal/bench ./internal/server
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Download road graphs
        run: |
          set -euo pipefail
          download() {
            local name=$1
            local url=$2
            local pbf="$RUNNER_TEMP/$name.osm.pbf"
            curl -fL --retry 6 --retry-all-errors --retry-delay 2 "$url" -o "$pbf"
            osmium cat "$pbf" -o "$RUNNER_TEMP/$name.osm" --overwrite
          }
          download andorra https://download.geofabrik.de/europe/andorra-latest.osm.pbf
          download bremen https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf
          download luxembourg https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf \
            -o "$RUNNER_TEMP/kanto.osm.pbf"
          osmium extract \
            --bbox 139.45,35.45,140.05,35.90 \
            --strategy complete_ways --overwrite \
            --output "$RUNNER_TEMP/tokyo.osm.pbf" \
            "$RUNNER_TEMP/kanto.osm.pbf"
          osmium cat "$RUNNER_TEMP/tokyo.osm.pbf" -o "$RUNNER_TEMP/tokyo.osm" --overwrite
      - name: Import graphs
        run: |
          set -euo pipefail
          for region in andorra bremen luxembourg tokyo; do
            /usr/bin/time -v -o "$RUNNER_TEMP/import-$region.time" \
              "$RUNNER_TEMP/aegis" import-osm \
                --input "$RUNNER_TEMP/$region.osm" \
                --output "$RUNNER_TEMP/$region-time.aegis" \
                --profile car --metric time
          done
      - name: Benchmark production versus corridor
        run: |
          set -euo pipefail
          out=artifacts/corridor-screen
          mkdir -p "$out"
          uname -a > "$out/hardware.txt"
          lscpu >> "$out/hardware.txt"
          go version >> "$out/hardware.txt"
          for region in andorra bremen luxembourg tokyo; do
            for seed in 1010 424242 20260717; do
              dir="$out/$region/seed-$seed"
              mkdir -p "$dir"
              repeats=3
              order=rotated
              queries=500
              if [ "$region" = tokyo ]; then
                repeats=1
                order=interleaved
              fi
              "$RUNNER_TEMP/aegis" benchmark \
                --graph "$RUNNER_TEMP/$region-time.aegis" \
                --queries "$queries" \
                --repeats "$repeats" \
                --order "$order" \
                --suite mixed \
                --seed "$seed" \
                --algorithms dijkstra,aegis,aegis-corridor \
                --output "$dir/report.json" \
                --html ""
            done
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: acbs-corridor-screen
          path: artifacts/corridor-screen
          if-no-files-found: error
