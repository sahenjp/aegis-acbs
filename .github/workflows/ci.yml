name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-current:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/aegis

  compatibility-go123:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go build ./cmd/aegis

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./internal/search ./internal/graph ./internal/bench ./internal/server

  quality-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Cross-build
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aegis-linux-amd64" ./cmd/aegis
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aegis-linux-arm64" ./cmd/aegis
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aegis-windows-amd64.exe" ./cmd/aegis
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aegis-darwin-amd64" ./cmd/aegis
      - name: Shell syntax
        shell: bash
        run: bash -n scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py

  routingkit-adapter-smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Compile Aegis exporter
        shell: bash
        run: go run -tags routingkitbaseline scripts/export_routingkit_baseline.go -h
      - name: Build pinned RoutingKit and comparator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev g++ osmium-tool
          git clone https://github.com/RoutingKit/RoutingKit.git "$RUNNER_TEMP/RoutingKit"
          git -C "$RUNNER_TEMP/RoutingKit" checkout 54d49bb0cdea56dde182357522e4e86a03c57852
          make -C "$RUNNER_TEMP/RoutingKit" -j2
          g++ -O3 -DNDEBUG -std=c++11 \
            -I"$RUNNER_TEMP/RoutingKit/include" \
            scripts/routingkit_ch_baseline.cpp \
            -L"$RUNNER_TEMP/RoutingKit/lib" -lroutingkit \
            -lz -fopenmp -pthread -lm \
            -o "$RUNNER_TEMP/routingkit_ch_baseline"
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Replay identical Andorra query pairs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            https://download.geofabrik.de/europe/andorra-latest.osm.pbf \
            -o "$RUNNER_TEMP/andorra.osm.pbf"
          osmium cat "$RUNNER_TEMP/andorra.osm.pbf" -o "$RUNNER_TEMP/andorra.osm" --overwrite
          "$RUNNER_TEMP/aegis" import-osm \
            --input "$RUNNER_TEMP/andorra.osm" \
            --output "$RUNNER_TEMP/andorra-time.aegis" \
            --profile car --metric time
          "$RUNNER_TEMP/aegis" benchmark \
            --graph "$RUNNER_TEMP/andorra-time.aegis" \
            --queries 300 --repeats 1 --order interleaved --suite mixed \
            --seed 424242 --algorithms dijkstra,aegis \
            --output "$RUNNER_TEMP/andorra-report.json" --html ""
          go run -tags routingkitbaseline scripts/export_routingkit_baseline.go \
            --graph "$RUNNER_TEMP/andorra-time.aegis" \
            --report "$RUNNER_TEMP/andorra-report.json" \
            --output "$RUNNER_TEMP/routingkit-input.txt"
          LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib" \
            "$RUNNER_TEMP/routingkit_ch_baseline" \
              "$RUNNER_TEMP/routingkit-input.txt" \
              "$RUNNER_TEMP/routingkit-andorra.json" 3
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'routingkit-andorra.json')
          d = json.load(open(p))
          assert d['allCorrect'] is True
          assert d['queries'] == 300
          print('routingkit-road-smoke', json.dumps({k:d[k] for k in ['queries','preprocessNs','medianNs','p95Ns','p99Ns','allCorrect']}))
          PY
