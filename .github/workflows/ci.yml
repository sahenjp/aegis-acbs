name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-current:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/aegis

  compatibility-go123:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go build ./cmd/aegis

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./internal/search ./internal/graph ./internal/bench ./internal/server

  quality-and-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Cross-build
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aegis-linux-amd64" ./cmd/aegis
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aegis-linux-arm64" ./cmd/aegis
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aegis-windows-amd64.exe" ./cmd/aegis
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aegis-darwin-amd64" ./cmd/aegis
      - name: Shell syntax
        shell: bash
        run: bash -n scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py

  ch-adapter-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Compile and execute pinned CH comparator smoke
        shell: bash
        run: |
          go get github.com/LdDl/ch@v1.10.0
          go run -tags chbaseline scripts/ch_baseline.go -h
          go run -tags chbaseline scripts/ch_baseline_smoke.go

  ch-road-smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install Osmium and build Aegis
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Build same-cost Andorra graph and reference queries
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            https://download.geofabrik.de/europe/andorra-latest.osm.pbf \
            -o "$RUNNER_TEMP/andorra.osm.pbf"
          osmium cat "$RUNNER_TEMP/andorra.osm.pbf" -o "$RUNNER_TEMP/andorra.osm" --overwrite
          "$RUNNER_TEMP/aegis" import-osm \
            --input "$RUNNER_TEMP/andorra.osm" \
            --output "$RUNNER_TEMP/andorra-time.aegis" \
            --profile car --metric time
          "$RUNNER_TEMP/aegis" benchmark \
            --graph "$RUNNER_TEMP/andorra-time.aegis" \
            --queries 300 --repeats 1 --order interleaved --suite mixed \
            --seed 424242 --algorithms dijkstra,aegis \
            --output "$RUNNER_TEMP/andorra-report.json" --html ""
      - name: Replay identical query pairs through pinned CH
        shell: bash
        run: |
          go get github.com/LdDl/ch@v1.10.0
          go run -tags chbaseline scripts/ch_baseline.go \
            --graph "$RUNNER_TEMP/andorra-time.aegis" \
            --report "$RUNNER_TEMP/andorra-report.json" \
            --repeats 3 \
            --output "$RUNNER_TEMP/ch-andorra.json"
