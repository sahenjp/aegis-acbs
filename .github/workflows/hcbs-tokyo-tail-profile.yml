name: HCBS Tokyo tail profile

on:
  pull_request:
    paths:
      - 'scripts/export_routingkit_hcbs_classes.go'
      - 'scripts/routingkit_hcbs_class_profile.cpp'
      - '.github/workflows/hcbs-tokyo-tail-profile.yml'

concurrency:
  group: hcbs-tokyo-tail-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build pinned RoutingKit and profiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev g++ osmium-tool
          git clone https://github.com/RoutingKit/RoutingKit.git "$RUNNER_TEMP/RoutingKit"
          git -C "$RUNNER_TEMP/RoutingKit" checkout 54d49bb0cdea56dde182357522e4e86a03c57852
          make -C "$RUNNER_TEMP/RoutingKit" -j2
          g++ -O3 -DNDEBUG -std=c++17 -march=native \
            -I"$RUNNER_TEMP/RoutingKit/include" \
            scripts/routingkit_hcbs_class_profile.cpp \
            -L"$RUNNER_TEMP/RoutingKit/lib" -lroutingkit \
            -lz -fopenmp -pthread -lm \
            -o "$RUNNER_TEMP/hcbs_class_profile"
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
          go run -tags routingkithcbsclasses scripts/export_routingkit_hcbs_classes.go -h >/dev/null
      - name: Build Tokyo metro graph
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf \
            -o "$RUNNER_TEMP/kanto.osm.pbf"
          osmium extract \
            --bbox 139.45,35.45,140.05,35.90 \
            --strategy complete_ways --overwrite \
            --output "$RUNNER_TEMP/tokyo.osm.pbf" \
            "$RUNNER_TEMP/kanto.osm.pbf"
          osmium cat "$RUNNER_TEMP/tokyo.osm.pbf" -o "$RUNNER_TEMP/tokyo.osm" --overwrite
          "$RUNNER_TEMP/aegis" import-osm \
            --input "$RUNNER_TEMP/tokyo.osm" \
            --output "$RUNNER_TEMP/tokyo-time.aegis" \
            --profile car --metric time
      - name: Export classified 30k queries
        shell: bash
        run: |
          go run -tags routingkithcbsclasses scripts/export_routingkit_hcbs_classes.go \
            --graph "$RUNNER_TEMP/tokyo-time.aegis" \
            --queries-per-seed 10000 \
            --seeds 1010,424242,20260717 \
            --output "$RUNNER_TEMP/tokyo-classes.txt"
      - name: Run three rotated class profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hcbs-tokyo-tail
          uname -a > artifacts/hcbs-tokyo-tail/hardware.txt
          lscpu >> artifacts/hcbs-tokyo-tail/hardware.txt
          for run in 1 2 3; do
            /usr/bin/time -v -o "artifacts/hcbs-tokyo-tail/run-$run.time" \
              env LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib" \
              "$RUNNER_TEMP/hcbs_class_profile" "$RUNNER_TEMP/tokyo-classes.txt" 31 \
              | tee "artifacts/hcbs-tokyo-tail/run-$run.txt"
            grep -q 'exact_checks=60000' "artifacts/hcbs-tokyo-tail/run-$run.txt"
            grep -q 'lower-key-vs-ch class=global' "artifacts/hcbs-tokyo-tail/run-$run.txt"
            grep -q 'lower-key-vs-ch class=local' "artifacts/hcbs-tokyo-tail/run-$run.txt"
            grep -q 'lower-key-vs-ch class=regional' "artifacts/hcbs-tokyo-tail/run-$run.txt"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: hcbs-tokyo-tail-profile
          path: artifacts/hcbs-tokyo-tail
          if-no-files-found: error
