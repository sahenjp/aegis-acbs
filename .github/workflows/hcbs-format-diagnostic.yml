name: HCBS format diagnostic

on:
  pull_request:
    paths:
      - 'internal/search/hcbs_index.go'
      - 'internal/search/hcbs_index_test.go'
      - '.github/workflows/hcbs-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Show gofmt diff
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d internal/search/hcbs_index.go internal/search/hcbs_index_test.go
          test -z "$(gofmt -l internal/search/hcbs_index.go internal/search/hcbs_index_test.go)"
