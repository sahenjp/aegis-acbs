name: Interleaved CH HCBS CCH comparison

on:
  pull_request:
    paths:
      - 'scripts/export_hierarchy_interleaved.go'
      - 'scripts/hierarchy_interleaved_benchmark.cpp'
      - 'scripts/materialize_hierarchy_interleaved.py'
      - 'scripts/materialize_hierarchy_interleaved_v2.py'
      - '.github/workflows/hierarchy-interleaved-smoke.yml'

concurrency:
  group: hierarchy-interleaved-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regional:
    strategy:
      fail-fast: false
      matrix:
        region: [andorra, bremen, luxembourg, tokyo]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build pinned RoutingKit and benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_hierarchy_interleaved_v2.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev g++ osmium-tool
          git clone https://github.com/RoutingKit/RoutingKit.git "$RUNNER_TEMP/RoutingKit"
          git -C "$RUNNER_TEMP/RoutingKit" checkout 54d49bb0cdea56dde182357522e4e86a03c57852
          make -C "$RUNNER_TEMP/RoutingKit" -j2
          g++ -O3 -DNDEBUG -std=c++17 -march=native \
            -I"$RUNNER_TEMP/RoutingKit/include" \
            scripts/hierarchy_interleaved_benchmark.cpp \
            -L"$RUNNER_TEMP/RoutingKit/lib" -lroutingkit \
            -lz -fopenmp -pthread -lm \
            -o "$RUNNER_TEMP/hierarchy_interleaved"
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
          go run -tags hierarchyinterleaved scripts/export_hierarchy_interleaved.go -h >/dev/null
      - name: Build identical road graph and 30k query set
        shell: bash
        run: |
          set -euo pipefail
          region='${{ matrix.region }}'
          case "$region" in
            andorra)
              curl -fL --retry 6 --retry-all-errors --retry-delay 2 https://download.geofabrik.de/europe/andorra-latest.osm.pbf -o "$RUNNER_TEMP/input.osm.pbf"
              ;;
            bremen)
              curl -fL --retry 6 --retry-all-errors --retry-delay 2 https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf -o "$RUNNER_TEMP/input.osm.pbf"
              ;;
            luxembourg)
              curl -fL --retry 6 --retry-all-errors --retry-delay 2 https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf -o "$RUNNER_TEMP/input.osm.pbf"
              ;;
            tokyo)
              curl -fL --retry 6 --retry-all-errors --retry-delay 2 https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf -o "$RUNNER_TEMP/kanto.osm.pbf"
              osmium extract --bbox 139.45,35.45,140.05,35.90 --strategy complete_ways --overwrite --output "$RUNNER_TEMP/input.osm.pbf" "$RUNNER_TEMP/kanto.osm.pbf"
              ;;
          esac
          osmium cat "$RUNNER_TEMP/input.osm.pbf" -o "$RUNNER_TEMP/input.osm" --overwrite
          "$RUNNER_TEMP/aegis" import-osm \
            --input "$RUNNER_TEMP/input.osm" \
            --output "$RUNNER_TEMP/road-time.aegis" \
            --profile car --metric time
          go run -tags hierarchyinterleaved scripts/export_hierarchy_interleaved.go \
            --graph "$RUNNER_TEMP/road-time.aegis" \
            --queries-per-seed 10000 \
            --seeds 1010,424242,20260717 \
            --output "$RUNNER_TEMP/hierarchy-input.txt"
      - name: Run three process-level repeats with rotated algorithm order
        shell: bash
        run: |
          set -euo pipefail
          dir="artifacts/hierarchy-interleaved-${{ matrix.region }}"
          mkdir -p "$dir"
          uname -a > "$dir/hardware.txt"
          lscpu >> "$dir/hardware.txt"
          for run in 1 2 3; do
            /usr/bin/time -v -o "$dir/run-$run.time" \
              env LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib" \
              "$RUNNER_TEMP/hierarchy_interleaved" "$RUNNER_TEMP/hierarchy-input.txt" 31 \
              | tee "$dir/run-$run.txt"
            grep -q 'routingkit-ch .*correct=true' "$dir/run-$run.txt"
            grep -q 'hcbs-alternate .*correct=true' "$dir/run-$run.txt"
            grep -q 'hcbs-lower-key .*correct=true' "$dir/run-$run.txt"
            grep -q 'hcbs-lower-key-queue .*correct=true' "$dir/run-$run.txt"
            grep -q 'routingkit-cch .*correct=true' "$dir/run-$run.txt"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hierarchy-interleaved-${{ matrix.region }}
          path: artifacts/hierarchy-interleaved-${{ matrix.region }}
          if-no-files-found: error
