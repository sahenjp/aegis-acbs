name: Interleaved CH HCBS CCH comparison

on:
  pull_request:
    paths:
      - 'scripts/export_hierarchy_interleaved.go'
      - 'scripts/hierarchy_interleaved_benchmark.cpp'
      - '.github/workflows/hierarchy-interleaved-smoke.yml'

concurrency:
  group: hierarchy-interleaved-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  andorra:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build pinned RoutingKit and benchmark
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev g++ osmium-tool
          git clone https://github.com/RoutingKit/RoutingKit.git "$RUNNER_TEMP/RoutingKit"
          git -C "$RUNNER_TEMP/RoutingKit" checkout 54d49bb0cdea56dde182357522e4e86a03c57852
          make -C "$RUNNER_TEMP/RoutingKit" -j2
          g++ -O3 -DNDEBUG -std=c++17 -march=native \
            -I"$RUNNER_TEMP/RoutingKit/include" \
            scripts/hierarchy_interleaved_benchmark.cpp \
            -L"$RUNNER_TEMP/RoutingKit/lib" -lroutingkit \
            -lz -fopenmp -pthread -lm \
            -o "$RUNNER_TEMP/hierarchy_interleaved"
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
          go run -tags hierarchyinterleaved scripts/export_hierarchy_interleaved.go -h >/dev/null
      - name: Build identical Andorra graph and 30k query set
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 \
            https://download.geofabrik.de/europe/andorra-latest.osm.pbf \
            -o "$RUNNER_TEMP/andorra.osm.pbf"
          osmium cat "$RUNNER_TEMP/andorra.osm.pbf" -o "$RUNNER_TEMP/andorra.osm" --overwrite
          "$RUNNER_TEMP/aegis" import-osm \
            --input "$RUNNER_TEMP/andorra.osm" \
            --output "$RUNNER_TEMP/andorra-time.aegis" \
            --profile car --metric time
          go run -tags hierarchyinterleaved scripts/export_hierarchy_interleaved.go \
            --graph "$RUNNER_TEMP/andorra-time.aegis" \
            --queries-per-seed 10000 \
            --seeds 1010,424242,20260717 \
            --output "$RUNNER_TEMP/hierarchy-input.txt"
      - name: Run five process-level repeats with rotated algorithm order
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hierarchy-interleaved
          uname -a > artifacts/hierarchy-interleaved/hardware.txt
          lscpu >> artifacts/hierarchy-interleaved/hardware.txt
          for run in 1 2 3 4 5; do
            /usr/bin/time -v -o "artifacts/hierarchy-interleaved/run-$run.time" \
              env LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib" \
              "$RUNNER_TEMP/hierarchy_interleaved" "$RUNNER_TEMP/hierarchy-input.txt" 31 \
              | tee "artifacts/hierarchy-interleaved/run-$run.txt"
            grep -q 'routingkit-ch .*correct=true' "artifacts/hierarchy-interleaved/run-$run.txt"
            grep -q 'hcbs-alternate .*correct=true' "artifacts/hierarchy-interleaved/run-$run.txt"
            grep -q 'hcbs-lower-key-queue .*correct=true' "artifacts/hierarchy-interleaved/run-$run.txt"
            grep -q 'routingkit-cch .*correct=true' "artifacts/hierarchy-interleaved/run-$run.txt"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: hierarchy-interleaved-andorra
          path: artifacts/hierarchy-interleaved
          if-no-files-found: error
