name: Entropic scheduler large-region evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  large-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Build
        run: go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Download and convert extracts
        run: |
          curl -fsSL --retry 3 https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf -o "$RUNNER_TEMP/luxembourg.osm.pbf"
          curl -fsSL --retry 3 https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf -o "$RUNNER_TEMP/bremen.osm.pbf"
          osmium cat "$RUNNER_TEMP/luxembourg.osm.pbf" -o "$RUNNER_TEMP/luxembourg.osm" --overwrite
          osmium cat "$RUNNER_TEMP/bremen.osm.pbf" -o "$RUNNER_TEMP/bremen.osm" --overwrite
      - name: Import and benchmark
        shell: bash
        env:
          QUERIES: '750'
          REPEATS: '3'
          SEEDS: '1010 424242'
        run: |
          set -euo pipefail
          for region in luxembourg bremen; do
            for metric in distance time; do
              graph="$RUNNER_TEMP/$region-$metric.aegis"
              "$RUNNER_TEMP/aegis" import-osm \
                --input "$RUNNER_TEMP/$region.osm" \
                --output "$graph" \
                --profile car \
                --metric "$metric"
              scripts/benchmark-entropic.sh "$graph" "artifacts/$region-$metric"
            done
          done
      - name: Upload reports
        uses: actions/upload-artifact@v6
        with:
          name: entropic-large-region-reports
          path: artifacts/*
          if-no-files-found: error
