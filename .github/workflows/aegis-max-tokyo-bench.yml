name: Aegis Max Tokyo Bench

on:
  push:
    branches: [research/aegis-max-exact]
    paths:
      - '.github/workflows/aegis-max-tokyo-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-max-tokyo-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokyo:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ zlib1g-dev osmium-tool curl
      - name: Run Tokyo identical-query benchmark
        shell: bash
        env:
          AEGIS_BENCH_MAKE_JOBS: '2'
        run: |
          set -euo pipefail
          bash scripts/aegis-max-road-bench.sh tokyo 300 time 16 "$RUNNER_TEMP/tokyo-bench"
      - name: Assert and summarize
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/tokyo-bench/summary.json" "$RUNNER_TEMP/tokyo-bench/selection-static.json" "$RUNNER_TEMP/tokyo-bench/selection-updates.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          src, static_p, updates_p, dst = sys.argv[1:]
          d = json.load(open(src, encoding='utf-8'))
          static = json.load(open(static_p, encoding='utf-8'))
          updates = json.load(open(updates_p, encoding='utf-8'))
          assert d['allCorrect'] is True
          assert d['queries'] == 300
          with open(dst, 'a', encoding='utf-8') as out:
              out.write('## Tokyo / time — 300 identical exact queries\n\n')
              out.write(f"{d['nodes']:,} nodes · {d['edges']:,} edges · all correct: **true**\n\n")
              out.write(f"adaptive selection: static **{static['selected']}** · 4 metric updates **{updates['selected']}**\n\n")
              out.write('| algorithm | mean | p50 | p95 | p99 | preprocess | update | amortized mean |\n|---|---:|---:|---:|---:|---:|---:|---:|\n')
              for r in d['rankingByQueryMean']:
                  ms = lambda n: f"{n/1e6:.6f} ms"
                  out.write(f"| {r['algorithm']} | {ms(r['meanNs'])} | {ms(r['p50Ns'])} | {ms(r['p95Ns'])} | {ms(r['p99Ns'])} | {ms(r['preprocessNs'])} | {ms(r['updateNs'])} | {ms(r['amortizedMeanNs'])} |\n")
          print(json.dumps({'benchmark': d, 'staticSelection': static, 'updatedSelection': updates}, indent=2, sort_keys=True))
          PY
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aegis-max-tokyo-time-300-alt16
          path: ${{ runner.temp }}/tokyo-bench/
          if-no-files-found: error
          retention-days: 30
