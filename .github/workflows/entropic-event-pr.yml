name: Entropic event-triggered phase evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  event-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Materialize event transition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/search/acbs.go')
          source = path.read_text()
          old = "\n\t\t\t}\n\t\t}\n\n\t\tfrontF, okF = peekValid(qf, df, settledF, &stats)"
          new = "\n\t\t\t}\n\t\t\tif opts.entropic && beforeBest == inf && bestReduced != inf {\n\t\t\t\tbreak\n\t\t\t}\n\t\t}\n\n\t\tfrontF, okF = peekValid(qf, df, settledF, &stats)"
          if source.count(old) != 1:
              raise SystemExit(f'event target count={source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          gofmt -w internal/search/acbs.go
          go test ./internal/search
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Download and convert extracts
        run: |
          curl -fsSL --retry 3 https://download.geofabrik.de/europe/andorra-latest.osm.pbf -o "$RUNNER_TEMP/andorra.osm.pbf"
          curl -fsSL --retry 3 https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf -o "$RUNNER_TEMP/liechtenstein.osm.pbf"
          osmium cat "$RUNNER_TEMP/andorra.osm.pbf" -o "$RUNNER_TEMP/andorra.osm" --overwrite
          osmium cat "$RUNNER_TEMP/liechtenstein.osm.pbf" -o "$RUNNER_TEMP/liechtenstein.osm" --overwrite
      - name: Import and evaluate
        run: |
          set -euo pipefail
          mkdir -p artifacts/event
          for region in andorra liechtenstein; do
            for metric in distance time; do
              graph="$RUNNER_TEMP/$region-$metric.aegis"
              "$RUNNER_TEMP/aegis" import-osm --input "$RUNNER_TEMP/$region.osm" --output "$graph" --profile car --metric "$metric"
              "$RUNNER_TEMP/aegis" benchmark \
                --graph "$graph" \
                --queries 1000 \
                --repeats 1 \
                --order interleaved \
                --suite mixed \
                --seed 1010 \
                --algorithms aegis,aegis-entropic \
                --output "artifacts/event/$region-$metric.json"
            done
          done
      - name: Upload reports
        uses: actions/upload-artifact@v6
        with:
          name: entropic-event-reports
          path: artifacts/event
          if-no-files-found: error
