name: Entropic v3 activation-gate evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: loose
            minimum_samples: 2
            evidence_margin: 0.15
            minimum_proof_gap: 0.005
          - name: balanced
            minimum_samples: 3
            evidence_margin: 0.35
            minimum_proof_gap: 0.01
          - name: strict
            minimum_samples: 4
            evidence_margin: 0.50
            minimum_proof_gap: 0.02
          - name: conservative
            minimum_samples: 6
            evidence_margin: 0.75
            minimum_proof_gap: 0.03
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Materialize candidate
        run: |
          python3 scripts/entropic_v3_experiment.py \
            --minimum-samples ${{ matrix.minimum_samples }} \
            --evidence-margin ${{ matrix.evidence_margin }} \
            --minimum-proof-gap ${{ matrix.minimum_proof_gap }}
          gofmt -w internal/search/acbs.go internal/search/acbs_entropic_scheduler.go internal/search/acbs_entropic_activation_test.go
          go test ./internal/search
          go vet ./internal/search
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Download regional extracts
        run: |
          set -euo pipefail
          for region in monaco andorra liechtenstein luxembourg bremen; do
            curl -fsSL --retry 3 "https://download.geofabrik.de/europe/$region-latest.osm.pbf" \
              -o "$RUNNER_TEMP/$region.osm.pbf"
            osmium cat "$RUNNER_TEMP/$region.osm.pbf" \
              -o "$RUNNER_TEMP/$region.osm" --overwrite
          done
      - name: Benchmark deterministic work
        run: |
          set -euo pipefail
          out="artifacts/v3-${{ matrix.name }}"
          mkdir -p "$out/materialized"
          cp internal/search/acbs.go "$out/materialized/"
          cp internal/search/acbs_entropic_scheduler.go "$out/materialized/"
          cp internal/search/acbs_entropic_activation_test.go "$out/materialized/"
          for region in monaco andorra liechtenstein luxembourg bremen; do
            for metric in distance time; do
              graph="$RUNNER_TEMP/$region-$metric.aegis"
              "$RUNNER_TEMP/aegis" import-osm \
                --input "$RUNNER_TEMP/$region.osm" \
                --output "$graph" \
                --profile car \
                --metric "$metric"
              for seed in 1010 424242 20260717; do
                run_dir="$out/$region-$metric/seed-$seed"
                mkdir -p "$run_dir"
                "$RUNNER_TEMP/aegis" benchmark \
                  --graph "$graph" \
                  --queries 500 \
                  --repeats 1 \
                  --order interleaved \
                  --suite mixed \
                  --seed "$seed" \
                  --algorithms aegis,aegis-entropic \
                  --output "$run_dir/report.json"
              done
            done
          done
      - name: Upload reports
        uses: actions/upload-artifact@v6
        with:
          name: entropic-v3-${{ matrix.name }}
          path: artifacts/v3-${{ matrix.name }}
          if-no-files-found: error
