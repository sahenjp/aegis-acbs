name: Metric ALT Tokyo validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Materialize candidates and standard ALT
        run: |
          python3 scripts/materialize_metric_alt_layout_sweep.py
          python3 scripts/materialize_astar_alt_baseline.py
          python3 scripts/materialize_directed_alt_baseline.py
          python3 scripts/materialize_metric_alt_pure_sweep.py
          python3 scripts/fix_metric_alt_pure_constructor.py
          python3 scripts/materialize_metric_alt_gate_sweep.py
          gofmt -w cmd/aegis/main.go internal/search/acbs.go internal/search/search.go internal/search/metric_alt.go internal/search/metric_alt_test.go internal/search/astar_alt.go internal/search/directed_alt.go internal/search/directed_alt_test.go internal/search/metric_alt_pure_test.go internal/search/metric_alt_gate_test.go
      - name: Validate
        run: |
          git diff --check
          go test ./...
          go vet ./...
          go test -race ./internal/search ./internal/graph ./internal/bench ./internal/server
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Build Tokyo metropolitan extract
        run: |
          set -euo pipefail
          pbf="$RUNNER_TEMP/kanto.osm.pbf"
          tokyo_pbf="$RUNNER_TEMP/tokyo-metro.osm.pbf"
          tokyo_osm="$RUNNER_TEMP/tokyo-metro.osm"
          curl -fL --retry 6 --retry-all-errors --retry-delay 3 \
            https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf \
            -o "$pbf"
          osmium fileinfo "$pbf" >/dev/null
          osmium extract \
            --bbox 139.45,35.45,140.05,35.90 \
            --strategy complete_ways \
            --overwrite \
            --output "$tokyo_pbf" \
            "$pbf"
          osmium fileinfo "$tokyo_pbf" >/dev/null
          osmium cat "$tokyo_pbf" -o "$tokyo_osm" --overwrite
          "$RUNNER_TEMP/aegis" import-osm \
            --input "$tokyo_osm" \
            --output "$RUNNER_TEMP/tokyo-time.aegis" \
            --profile car \
            --metric time
          "$RUNNER_TEMP/aegis" inspect --graph "$RUNNER_TEMP/tokyo-time.aegis" \
            > "$RUNNER_TEMP/tokyo-inspect.json"
      - name: Benchmark exact algorithms
        run: |
          set -euo pipefail
          out=artifacts/metric-alt-tokyo
          mkdir -p "$out"
          cp "$RUNNER_TEMP/tokyo-inspect.json" "$out/inspect.json"
          for seed in 1010 424242 20260717; do
            run_dir="$out/seed-$seed"
            mkdir -p "$run_dir"
            "$RUNNER_TEMP/aegis" benchmark \
              --graph "$RUNNER_TEMP/tokyo-time.aegis" \
              --queries 300 \
              --repeats 1 \
              --order interleaved \
              --suite mixed \
              --seed "$seed" \
              --algorithms dijkstra,bidijkstra,astar,astar-alt,astar-directed-alt,portfolio,aegis,aegis-alt,aegis-alt-pure-top2,aegis-alt-gate50,aegis-alt-gate75,aegis-alt-gate100,aegis-alt-gate125 \
              --output "$run_dir/report.json" \
              --html "" \
              2> >(tee "$run_dir/preprocess.log" >&2)
          done
      - uses: actions/upload-artifact@v6
        with:
          name: metric-alt-tokyo
          path: artifacts/metric-alt-tokyo
          if-no-files-found: error
