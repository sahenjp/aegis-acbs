name: Directed ALT baseline screening

on:
  pull_request:
    paths:
      - 'internal/search/**'
      - 'internal/bench/**'
      - 'scripts/materialize_metric_alt_layout_sweep.py'
      - 'scripts/materialize_astar_alt_baseline.py'
      - 'scripts/materialize_directed_alt_baseline.py'
      - 'scripts/fix_directed_alt_cli_preparation.py'
      - '.github/workflows/directed-alt-baseline-screen.yml'

concurrency:
  group: directed-alt-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Materialize exact directed ALT baseline
        run: |
          python3 scripts/materialize_metric_alt_layout_sweep.py
          python3 scripts/materialize_astar_alt_baseline.py
          python3 scripts/materialize_directed_alt_baseline.py
          python3 scripts/fix_directed_alt_cli_preparation.py
          gofmt -w \
            cmd/aegis/main.go \
            internal/search/search.go \
            internal/search/metric_alt.go \
            internal/search/metric_alt_test.go \
            internal/search/astar_alt.go \
            internal/search/directed_alt.go \
            internal/search/directed_alt_test.go
      - name: Validate exactness and build
        run: |
          git diff --check
          go test ./...
          go vet ./...
          go test -race ./internal/search ./internal/graph ./internal/bench ./internal/server
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Download real road graphs
        run: |
          set -euo pipefail
          download() {
            local name=$1
            local url=$2
            local pbf="$RUNNER_TEMP/$name.osm.pbf"
            curl -fL --retry 6 --retry-all-errors --retry-delay 3 "$url" -o "$pbf"
            osmium fileinfo "$pbf" >/dev/null
            osmium cat "$pbf" -o "$RUNNER_TEMP/$name.osm" --overwrite
          }
          download andorra https://download.geofabrik.de/europe/andorra-latest.osm.pbf
          download bremen https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf
          download luxembourg https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
          curl -fL --retry 6 --retry-all-errors --retry-delay 3 \
            https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf \
            -o "$RUNNER_TEMP/kanto.osm.pbf"
          osmium extract \
            --bbox 139.45,35.45,140.05,35.90 \
            --strategy complete_ways --overwrite \
            --output "$RUNNER_TEMP/tokyo-metro.osm.pbf" \
            "$RUNNER_TEMP/kanto.osm.pbf"
          osmium cat "$RUNNER_TEMP/tokyo-metro.osm.pbf" -o "$RUNNER_TEMP/tokyo-metro.osm" --overwrite
      - name: Import graphs
        run: |
          set -euo pipefail
          for region in andorra bremen luxembourg; do
            "$RUNNER_TEMP/aegis" import-osm \
              --input "$RUNNER_TEMP/$region.osm" \
              --output "$RUNNER_TEMP/$region-time.aegis" \
              --profile car --metric time
          done
          "$RUNNER_TEMP/aegis" import-osm \
            --input "$RUNNER_TEMP/tokyo-metro.osm" \
            --output "$RUNNER_TEMP/tokyo-time.aegis" \
            --profile car --metric time
      - name: Benchmark exact baselines
        run: |
          set -euo pipefail
          algorithms=dijkstra,bidijkstra,astar,aegis,aegis-alt,astar-alt,astar-directed-alt
          out=artifacts/directed-alt-baseline-screen
          mkdir -p "$out"
          for region in andorra bremen luxembourg tokyo; do
            graph="$RUNNER_TEMP/$region-time.aegis"
            for seed in 1010 424242 20260717; do
              run_dir="$out/$region/seed-$seed"
              mkdir -p "$run_dir"
              repeats=3
              order=rotated
              if [ "$region" = tokyo ]; then
                repeats=1
                order=interleaved
              fi
              /usr/bin/time -v -o "$run_dir/resources.txt" \
                "$RUNNER_TEMP/aegis" benchmark \
                  --graph "$graph" \
                  --queries 1000 \
                  --repeats "$repeats" \
                  --order "$order" \
                  --suite mixed \
                  --seed "$seed" \
                  --algorithms "$algorithms" \
                  --output "$run_dir/report.json" \
                  --html "" \
                  2> >(tee "$run_dir/preprocess.log" >&2)
            done
          done
      - uses: actions/upload-artifact@v6
        with:
          name: directed-alt-baseline-screen
          path: artifacts/directed-alt-baseline-screen
          if-no-files-found: error
