name: Aegis Max Exact

on:
  push:
    branches: [research/aegis-max-exact]
  pull_request:
    paths:
      - 'cmd/aegis-max/**'
      - 'cmd/aegis-max-batch/**'
      - 'cmd/aegis-max-select/**'
      - 'cmd/aegis-routingkit-export/**'
      - 'cmd/aegis-routingkit-cch-export/**'
      - 'internal/maxsearch/**'
      - 'experimental/routingkit/**'
      - 'scripts/build-routingkit-ch-server.sh'
      - 'scripts/build-routingkit-cch-server.sh'
      - 'docs/AEGIS_MAX_EXACT.md'
      - 'docs/AEGIS_MAX_ADAPTIVE.md'
      - '.github/workflows/aegis-max-exact.yml'

permissions:
  contents: read

concurrency:
  group: aegis-max-exact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', '1.26.x']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./internal/maxsearch ./internal/search ./internal/graph
      - run: go vet ./internal/maxsearch ./cmd/aegis-max ./cmd/aegis-max-batch ./cmd/aegis-max-select ./cmd/aegis-routingkit-export ./cmd/aegis-routingkit-cch-export
      - run: go build ./cmd/aegis-max ./cmd/aegis-max-batch ./cmd/aegis-max-select ./cmd/aegis-routingkit-export ./cmd/aegis-routingkit-cch-export

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: go build -o /tmp/aegis ./cmd/aegis
      - run: go build -o /tmp/aegis-max ./cmd/aegis-max
      - run: go build -o /tmp/aegis-max-select ./cmd/aegis-max-select
      - run: /tmp/aegis import-osm --input benchdata/hatfield-uk.osm --output /tmp/hatfield.aegis --profile car --metric distance
      - run: /tmp/aegis-max --graph /tmp/hatfield.aegis --source 0 --target 10 --mode efficient --verify > /tmp/efficient.json
      - run: /tmp/aegis-max --graph /tmp/hatfield.aegis --source 0 --target 10 --mode latency --parallel 3 --verify > /tmp/latency.json
      - run: /tmp/aegis-max --graph /tmp/hatfield.aegis --source 0 --target 10 --mode latency --parallel 2 --verify --consensus > /tmp/consensus.json

  routingkit-preprocessed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build pinned RoutingKit and sidecars
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ zlib1g-dev
          git clone https://github.com/RoutingKit/RoutingKit.git "$RUNNER_TEMP/RoutingKit"
          git -C "$RUNNER_TEMP/RoutingKit" checkout 54d49bb0cdea56dde182357522e4e86a03c57852
          make -C "$RUNNER_TEMP/RoutingKit" -j2
          bash scripts/build-routingkit-ch-server.sh "$RUNNER_TEMP/RoutingKit" "$RUNNER_TEMP/aegis-routingkit-ch-server"
          bash scripts/build-routingkit-cch-server.sh "$RUNNER_TEMP/RoutingKit" "$RUNNER_TEMP/aegis-routingkit-cch-server"
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
          go build -o "$RUNNER_TEMP/aegis-max" ./cmd/aegis-max
          go build -o "$RUNNER_TEMP/aegis-max-batch" ./cmd/aegis-max-batch
          go build -o "$RUNNER_TEMP/aegis-max-select" ./cmd/aegis-max-select
          go build -o "$RUNNER_TEMP/aegis-routingkit-export" ./cmd/aegis-routingkit-export
          go build -o "$RUNNER_TEMP/aegis-routingkit-cch-export" ./cmd/aegis-routingkit-cch-export
      - name: Export identical Hatfield graph and choose reachable pairs
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aegis" import-osm \
            --input benchdata/hatfield-uk.osm \
            --output "$RUNNER_TEMP/hatfield.aegis" \
            --profile car --metric distance
          "$RUNNER_TEMP/aegis-routingkit-export" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --output "$RUNNER_TEMP/hatfield.routingkit-ch"
          "$RUNNER_TEMP/aegis-routingkit-cch-export" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --output "$RUNNER_TEMP/hatfield.routingkit-cch"
          python3 - <<'PY'
          import os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'hatfield.routingkit-ch')
          lines = open(p, encoding='utf-8').read().splitlines()
          if len(lines) < 4:
              raise SystemExit('RoutingKit export did not contain an edge')
          node_count, edge_count = map(int, lines[2].split())
          if edge_count < 3:
              raise SystemExit('RoutingKit export contains too few edges')
          pairs = []
          for line in lines[3:3 + edge_count]:
              source, target, _ = map(int, line.split())
              if source != target and 0 <= source < node_count and 0 <= target < node_count:
                  pairs.append((source, target))
              if len(pairs) == 4:
                  break
          if len(pairs) < 3:
              raise SystemExit('could not find enough reachable edge pairs')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'RK_SOURCE={pairs[0][0]}\nRK_TARGET={pairs[0][1]}\n')
          q = os.path.join(os.environ['RUNNER_TEMP'], 'rk-queries.txt')
          with open(q, 'w', encoding='utf-8') as out:
              for source, target in pairs:
                  out.write(f'{source} {target}\n')
          print('using guaranteed reachable directed edges:', pairs)
          PY
      - name: Verify CH cold build, warm load, path and native consensus
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          rm -f "$RUNNER_TEMP/hatfield.routingkit-ch.ch-index" "$RUNNER_TEMP/hatfield.routingkit-ch.ch-index.meta"
          "$RUNNER_TEMP/aegis-max" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --source "$RK_SOURCE" --target "$RK_TARGET" --mode efficient --verify \
            --algorithms routingkit-ch \
            --routingkit-ch-server "$RUNNER_TEMP/aegis-routingkit-ch-server" \
            --routingkit-ch-graph "$RUNNER_TEMP/hatfield.routingkit-ch" \
            > "$RUNNER_TEMP/ch-only.json"
          "$RUNNER_TEMP/aegis-max" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --source "$RK_SOURCE" --target "$RK_TARGET" --mode latency --parallel 2 --verify --consensus \
            --algorithms routingkit-ch,bidijkstra \
            --routingkit-ch-server "$RUNNER_TEMP/aegis-routingkit-ch-server" \
            --routingkit-ch-graph "$RUNNER_TEMP/hatfield.routingkit-ch" \
            > "$RUNNER_TEMP/ch-consensus.json"
          python3 - <<'PY'
          import json, os
          root = os.environ['RUNNER_TEMP']
          cold = json.load(open(os.path.join(root, 'ch-only.json')))
          warm = json.load(open(os.path.join(root, 'ch-consensus.json')))
          assert cold['winner'] == 'routingkit-ch'
          assert cold['result']['stats']['reachable'] is True
          c = cold['routingKitCH']
          w = warm['routingKitCH']
          assert c['cacheHit'] is False
          assert w['cacheHit'] is True
          assert c['preprocessNs'] > 0 and c['rebuildNs'] == c['preprocessNs']
          assert w['preprocessNs'] > 0 and w['rebuildNs'] == c['rebuildNs']
          assert c['cacheIndexBytes'] > 0 and w['cacheIndexBytes'] == c['cacheIndexBytes']
          assert len(c['fingerprint']) == 64 and w['fingerprint'] == c['fingerprint']
          assert warm['consensusReached'] is True
          assert warm['result']['stats']['distance'] == cold['result']['stats']['distance']
          print('routingkit-ch cold/warm integration ok')
          PY
      - name: Verify CCH path and native consensus
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$RUNNER_TEMP/aegis-max" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --source "$RK_SOURCE" --target "$RK_TARGET" --mode efficient --verify \
            --algorithms routingkit-cch \
            --routingkit-cch-server "$RUNNER_TEMP/aegis-routingkit-cch-server" \
            --routingkit-cch-graph "$RUNNER_TEMP/hatfield.routingkit-cch" \
            > "$RUNNER_TEMP/cch-only.json"
          "$RUNNER_TEMP/aegis-max" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --source "$RK_SOURCE" --target "$RK_TARGET" --mode latency --parallel 2 --verify --consensus \
            --algorithms routingkit-cch,bidijkstra \
            --routingkit-cch-server "$RUNNER_TEMP/aegis-routingkit-cch-server" \
            --routingkit-cch-graph "$RUNNER_TEMP/hatfield.routingkit-cch" \
            > "$RUNNER_TEMP/cch-consensus.json"
          python3 - <<'PY'
          import json, os
          root = os.environ['RUNNER_TEMP']
          one = json.load(open(os.path.join(root, 'cch-only.json')))
          two = json.load(open(os.path.join(root, 'cch-consensus.json')))
          assert one['winner'] == 'routingkit-cch'
          assert one['result']['stats']['reachable'] is True
          m = one['routingKitCCH']
          assert m['orderNs'] > 0 and m['topologyNs'] > 0 and m['customizeNs'] > 0
          assert m['preprocessNs'] == m['orderNs'] + m['topologyNs'] + m['customizeNs']
          assert len(m['fingerprint']) == 64
          assert two['consensusReached'] is True
          assert two['result']['stats']['distance'] == one['result']['stats']['distance']
          print('routingkit-cch integration ok')
          PY
      - name: Reuse CH and CCH preprocessing across batches
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$RUNNER_TEMP/aegis-max-batch" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --queries "$RUNNER_TEMP/rk-queries.txt" \
            --routingkit-ch-server "$RUNNER_TEMP/aegis-routingkit-ch-server" \
            --routingkit-ch-graph "$RUNNER_TEMP/hatfield.routingkit-ch" \
            --algorithms routingkit-ch,bidijkstra \
            --verify --consensus --summary-only \
            > "$RUNNER_TEMP/ch-batch.json"
          "$RUNNER_TEMP/aegis-max-batch" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --queries "$RUNNER_TEMP/rk-queries.txt" \
            --routingkit-cch-server "$RUNNER_TEMP/aegis-routingkit-cch-server" \
            --routingkit-cch-graph "$RUNNER_TEMP/hatfield.routingkit-cch" \
            --algorithms routingkit-cch,bidijkstra \
            --verify --consensus --summary-only \
            > "$RUNNER_TEMP/cch-batch.json"
          python3 - <<'PY'
          import json, os
          root = os.environ['RUNNER_TEMP']
          ch = json.load(open(os.path.join(root, 'ch-batch.json')))
          assert ch['routingKitCH']['cacheHit'] is True
          assert ch['routingKitCH']['preprocessNs'] > 0
          assert ch['routingKitCH']['rebuildNs'] > 0
          assert ch['routingKitCH']['cacheIndexBytes'] > 0
          for d, alg, metadata in [
              (ch, 'routingkit-ch', 'routingKitCH'),
              (json.load(open(os.path.join(root, 'cch-batch.json'))), 'routingkit-cch', 'routingKitCCH'),
          ]:
              s = d['report']['summary']
              assert s['queries'] >= 3
              assert s['reachable'] == s['queries']
              assert s['consensusReached'] == s['queries']
              assert s['winnerCounts'].get(alg) == s['queries']
              assert s['nativeFallbacks'] == 0
              assert s['p50Ns'] > 0 and s['p95Ns'] > 0 and s['maxNs'] > 0
              assert d[metadata]['preprocessNs'] > 0
              assert d[metadata]['sidecarGraphBytes'] > 0
          print('persistent CH/CCH batch reuse ok')
          PY
      - name: Reject mismatched CH and CCH graph identity
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/RoutingKit/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          for kind in ch cch; do
            cp "$RUNNER_TEMP/hatfield.routingkit-$kind" "$RUNNER_TEMP/bad.routingkit-$kind"
            KIND="$kind" python3 - <<'PY'
          import os
          kind = os.environ['KIND']
          p = os.path.join(os.environ['RUNNER_TEMP'], f'bad.routingkit-{kind}')
          lines = open(p, encoding='utf-8').read().splitlines()
          lines[1] = '0' * 64
          open(p, 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY
          done
          if "$RUNNER_TEMP/aegis-max" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --source "$RK_SOURCE" --target "$RK_TARGET" --mode efficient --verify \
            --algorithms routingkit-ch \
            --routingkit-ch-server "$RUNNER_TEMP/aegis-routingkit-ch-server" \
            --routingkit-ch-graph "$RUNNER_TEMP/bad.routingkit-ch"; then
            echo "mismatched RoutingKit CH graph was unexpectedly accepted" >&2
            exit 1
          fi
          if "$RUNNER_TEMP/aegis-max" \
            --graph "$RUNNER_TEMP/hatfield.aegis" \
            --source "$RK_SOURCE" --target "$RK_TARGET" --mode efficient --verify \
            --algorithms routingkit-cch \
            --routingkit-cch-server "$RUNNER_TEMP/aegis-routingkit-cch-server" \
            --routingkit-cch-graph "$RUNNER_TEMP/bad.routingkit-cch"; then
            echo "mismatched RoutingKit CCH graph was unexpectedly accepted" >&2
            exit 1
          fi

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./internal/maxsearch ./internal/search ./internal/graph
