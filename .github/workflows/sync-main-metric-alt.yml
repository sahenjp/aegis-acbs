name: Sync main into metric ALT

on:
  push:
    branches: [feat/metric-alt-potential]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-main]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/metric-alt-potential
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Merge main and preserve metric ALT
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'main already included'
            exit 0
          fi
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unmerged=$(git diff --name-only --diff-filter=U)
            unexpected=$(printf '%s\n' "$unmerged" | grep -v '^internal/search/search.go$' || true)
            if [ -n "$unexpected" ]; then
              echo "unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            git checkout --ours internal/search/search.go
            git add internal/search/search.go
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/search/search.go')
          text = path.read_text()
          old = '\tr.Stats.DurationNS = time.Since(started).Nanoseconds()\n\treturn r, err\n}\n\n// Select returns'
          new = '''\tr.Stats.DurationNS = measuredNanoseconds(time.Since(started))
\treturn r, err
}

func measuredNanoseconds(duration time.Duration) int64 {
\tnanoseconds := duration.Nanoseconds()
\tif nanoseconds < 1 {
\t\treturn 1
\t}
\treturn nanoseconds
}

// Select returns'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'func measuredNanoseconds(duration time.Duration) int64 {' not in text:
              raise SystemExit('could not integrate measuredNanoseconds')
          path.write_text(text)
          PY
          gofmt -w internal/search/search.go
          git add -A
      - name: Validate merged tree
        run: |
          git diff --check --cached
          go test ./...
          go vet ./...
          go test -race ./internal/search ./internal/graph ./internal/bench ./internal/server
          go build ./cmd/aegis
      - name: Commit and push
        run: |
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'merge: sync main timing fix [sync-main]'
          git push origin HEAD:feat/metric-alt-potential
