name: Metric ALT known baselines

on:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Materialize cache-local candidates
        run: |
          python3 scripts/materialize_metric_alt_layout_sweep.py
          python3 scripts/materialize_astar_alt_baseline.py
          python3 scripts/materialize_directed_alt_baseline.py
          gofmt -w cmd/aegis/main.go internal/search/acbs.go internal/search/search.go internal/search/metric_alt.go internal/search/metric_alt_test.go internal/search/astar_alt.go internal/search/directed_alt.go internal/search/directed_alt_test.go
      - name: Validate
        run: |
          git diff --check
          go test ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/aegis" ./cmd/aegis
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Download extracts
        run: |
          set -euo pipefail
          download() {
            local name=$1
            local url=$2
            local pbf="$RUNNER_TEMP/$name.osm.pbf"
            curl -fL --retry 6 --retry-all-errors --retry-delay 2 "$url" -o "$pbf"
            osmium fileinfo "$pbf" >/dev/null
            osmium cat "$pbf" -o "$RUNNER_TEMP/$name.osm" --overwrite
          }
          download andorra https://download.geofabrik.de/europe/andorra-latest.osm.pbf
          download bremen https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf
          download luxembourg https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
      - name: Benchmark exact algorithms
        run: |
          set -euo pipefail
          out=artifacts/metric-alt-known-baselines
          mkdir -p "$out"
          for region in andorra bremen luxembourg; do
            for metric in distance time; do
              graph="$RUNNER_TEMP/$region-$metric.aegis"
              "$RUNNER_TEMP/aegis" import-osm \
                --input "$RUNNER_TEMP/$region.osm" \
                --output "$graph" \
                --profile car \
                --metric "$metric"
              for seed in 1010 424242 20260717; do
                run_dir="$out/$region-$metric/seed-$seed"
                mkdir -p "$run_dir"
                "$RUNNER_TEMP/aegis" benchmark \
                  --graph "$graph" \
                  --queries 300 \
                  --repeats 3 \
                  --order rotated \
                  --suite mixed \
                  --seed "$seed" \
                  --algorithms dijkstra,bidijkstra,astar,astar-alt,astar-directed-alt,portfolio,aegis,aegis-alt,aegis-alt-top4,aegis-alt-top2 \
                  --output "$run_dir/report.json" \
                  --html "" \
                  2> >(tee "$run_dir/preprocess.log" >&2)
              done
            done
          done
      - uses: actions/upload-artifact@v6
        with:
          name: metric-alt-known-baselines
          path: artifacts/metric-alt-known-baselines
          if-no-files-found: error
